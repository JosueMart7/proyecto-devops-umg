name: CI/CD Pipeline - Proyecto DevOps UMG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Login a Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Construir imagen Docker
      run: |
        docker build -t josuemart7/proyecto-devops-umg:latest ./app

    - name: Publicar imagen en Docker Hub
      run: |
        docker push josuemart7/proyecto-devops-umg:latest

    - name: Verificar despliegue
      run: |
        echo "✅ Imagen publicada exitosamente en Docker Hub"
        echo "🚀 Imagen: josuemart7/proyecto-devops-umg:latest"